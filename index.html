<header>
  <div class="headerRow">
    <h1>Mijn recepten</h1>
    <button id="langToggle" class="langBtn">NL</button>
  </div>
  <input id="search" type="search" placeholder="Zoek op recept of ingrediënt">
</header>
<main><div id="list" class="grid"></div><div id="detail" class="detail"></div></main>
<button id="addOpen" class="fab" aria-label="Recept toevoegen">+</button>

<div id="addModal" class="modal">
  <div class="modalCard">
    <div class="modalHead"><h3>Recept toevoegen</h3><button id="addClose" class="closeBtn">✕</button></div>
    <form id="addForm">
      <label for="addUrl">Link naar recept</label>
      <input id="addUrl" type="url" placeholder="https://..." required>
      <button id="addSubmit" type="submit">Toevoegen</button>
      <p id="addStatus" class="note"></p>
    </form>
    <p class="note">Foto-import volgt later.</p>
  </div>
</div>

<script src="app.js"></script>
