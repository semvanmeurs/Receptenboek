<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recepten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mijn recepten</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f251f;background:#f5f1e8}*{box-sizing:border-box}body{margin:0;background:#f5f1e8}header{position:sticky;top:0;z-index:5;background:rgba(245,241,232,.94);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid #ddd6c9}h1{margin:0 0 10px;font-size:28px}input[type=search]{width:100%;font-size:16px;padding:12px 14px;border:1px solid #cfc7b8;border-radius:12px;background:#fff}main{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:auto}.grid{display:grid;gap:10px}.card{background:#fff;border:1px solid #e1dbd0;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer}.card h2{font-size:19px;margin:0 0 7px}.meta{font-size:13px;color:#687067;display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef1ea;padding:4px 8px;border-radius:999px}.detail{display:none}.detail.active{display:block}.back{border:0;background:none;font-size:16px;padding:4px 0 14px;color:#355e3b}.detail h2{font-size:28px;margin:0 0 8px}.section{background:#fff;border:1px solid #e1dbd0;border-radius:16px;padding:16px;margin-top:12px}.section h3{margin:0 0 12px}.group-title{font-size:14px;color:#687067;margin:14px 0 6px;font-weight:650}.ingredient{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eee9df}.ingredient:last-child{border-bottom:0}.ingredient input{width:20px;height:20px;margin-top:1px}.ingredient.checked span{text-decoration:line-through;color:#8b8f89}.steps{padding-left:22px}.steps li{margin:0 0 12px;line-height:1.45}.note{font-size:13px;color:#6d706b}.empty{text-align:center;color:#777;padding:40px 8px}
</style>
</head>
<body>
<header><h1>Mijn recepten</h1><input id="search" type="search" placeholder="Zoek op recept of ingrediënt"></header>
<main><div id="list" class="grid"></div><div id="detail" class="detail"></div></main>
<script src="app.js"></script>
</body>
</html>
